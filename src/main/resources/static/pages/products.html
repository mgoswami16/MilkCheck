<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | MilkCheck</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a><span class="sep">/</span><span>Products</span>
    </nav>

    <div class="page-head">
      <h1>Our products</h1>
      <p>Fresh dairy, filtered your way.</p>
    </div>

    <form class="shop-toolbar" id="filters" autocomplete="off" onsubmit="return false">
      <div class="span-2">
        <label for="fKeyword">Search</label>
        <input class="input" id="fKeyword" type="search" placeholder="Search milk, curd, cheese…">
      </div>
      <div>
        <label for="fCategory">Category</label>
        <select class="input" id="fCategory"><option value="">All categories</option></select>
      </div>
      <div>
        <label for="fSort">Sort by</label>
        <select class="input" id="fSort">
          <option value="createdAt,desc">Newest</option>
          <option value="price,asc">Price: low to high</option>
          <option value="price,desc">Price: high to low</option>
          <option value="name,asc">Name: A to Z</option>
        </select>
      </div>
      <div>
        <label for="fMin">Min price</label>
        <input class="input" id="fMin" type="number" min="0" step="0.01" placeholder="0">
      </div>
      <div>
        <label for="fMax">Max price</label>
        <input class="input" id="fMax" type="number" min="0" step="0.01" placeholder="Any">
      </div>
      <div class="shop-toolbar-foot">
        <label class="check" style="margin:0;text-transform:none;letter-spacing:0;font-size:.875rem;font-weight:500;color:inherit">
          <input type="checkbox" id="fStock"> In stock only
        </label>
        <button type="button" class="btn btn-ghost btn-sm" id="fClear">Clear filters</button>
      </div>
    </form>

    <p class="results-meta" id="meta" aria-live="polite"></p>
    <div class="product-grid" id="grid"></div>
    <nav class="pagination" id="pager" aria-label="Pagination"></nav>
    <div style="height:56px"></div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import '/js/layout.js';
    import { $, getParam, debounce, productCard, skeletonCards, bindAddToCart } from '/js/ui.js';
    import { catalogApi } from '/js/api.js';

    const SIZE = 12;
    const DEFAULT_SORT = 'createdAt,desc';

    const state = {
      keyword: getParam('keyword') || '',
      categoryId: getParam('categoryId') || '',
      minPrice: getParam('minPrice') || '',
      maxPrice: getParam('maxPrice') || '',
      inStockOnly: getParam('inStockOnly') === 'true',
      sort: getParam('sort') || DEFAULT_SORT,
      page: Math.max(0, parseInt(getParam('page') || '0', 10) || 0),
    };

    const el = {
      keyword: $('#fKeyword'), category: $('#fCategory'), sort: $('#fSort'),
      min: $('#fMin'), max: $('#fMax'), stock: $('#fStock'), clear: $('#fClear'),
      grid: $('#grid'), meta: $('#meta'), pager: $('#pager'),
    };

    function applyStateToInputs() {
      el.keyword.value = state.keyword;
      el.category.value = state.categoryId;
      el.sort.value = state.sort;
      el.min.value = state.minPrice;
      el.max.value = state.maxPrice;
      el.stock.checked = state.inStockOnly;
    }

    function queryParams() {
      const q = { page: state.page, size: SIZE, sort: state.sort };
      if (state.keyword.trim()) q.keyword = state.keyword.trim();
      if (state.categoryId) q.categoryId = state.categoryId;
      if (state.minPrice !== '') q.minPrice = state.minPrice;
      if (state.maxPrice !== '') q.maxPrice = state.maxPrice;
      if (state.inStockOnly) q.inStockOnly = true;
      return q;
    }

    function syncUrl() {
      const p = new URLSearchParams();
      if (state.keyword.trim()) p.set('keyword', state.keyword.trim());
      if (state.categoryId) p.set('categoryId', state.categoryId);
      if (state.minPrice !== '') p.set('minPrice', state.minPrice);
      if (state.maxPrice !== '') p.set('maxPrice', state.maxPrice);
      if (state.inStockOnly) p.set('inStockOnly', 'true');
      if (state.sort !== DEFAULT_SORT) p.set('sort', state.sort);
      if (state.page > 0) p.set('page', state.page);
      const qs = p.toString();
      history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
    }

    function renderPager(page, totalPages) {
      if (!totalPages || totalPages <= 1) { el.pager.innerHTML = ''; return; }
      const set = new Set([0, totalPages - 1, page - 1, page, page + 1]);
      const nums = [...set].filter(n => n >= 0 && n < totalPages).sort((a, b) => a - b);
      let html = `<button class="page-btn" data-page="${page - 1}" ${page === 0 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
      let prev = -1;
      for (const n of nums) {
        if (n - prev > 1) html += '<span class="page-gap">…</span>';
        html += `<button class="page-btn ${n === page ? 'active' : ''}" data-page="${n}" ${n === page ? 'aria-current="page"' : ''}>${n + 1}</button>`;
        prev = n;
      }
      html += `<button class="page-btn" data-page="${page + 1}" ${page >= totalPages - 1 ? 'disabled' : ''} aria-label="Next page">›</button>`;
      el.pager.innerHTML = html;
    }

    let requestId = 0;
    async function load({ scroll = false } = {}) {
      const myId = ++requestId;
      el.grid.innerHTML = skeletonCards(8);
      el.pager.innerHTML = '';
      syncUrl();
      if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        const res = await catalogApi.products(queryParams());
        if (myId !== requestId) return; // a newer request superseded this one

        const items = res.content ?? [];
        const total = res.totalElements ?? items.length;
        el.meta.textContent = total === 1 ? '1 product found' : `${total} products found`;

        if (!items.length) {
          el.grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
              <h3>No products match your filters</h3>
              <p>Try a different search or clear the filters.</p>
              <button class="btn btn-primary btn-sm" id="emptyClear">Clear filters</button>
            </div>`;
          $('#emptyClear').addEventListener('click', clearFilters);
          return;
        }
        el.grid.innerHTML = items.map((p, i) => productCard(p, i)).join('');
        bindAddToCart(el.grid);
        renderPager(res.page ?? state.page, res.totalPages);
      } catch (err) {
        if (myId !== requestId) return;
        el.meta.textContent = '';
        el.grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <h3>Couldn't load products</h3>
            <p>${err?.message ? String(err.message).replace(/[<>&]/g, '') : 'Please try again.'}</p>
            <button class="btn btn-outline btn-sm" id="retry">Try again</button>
          </div>`;
        $('#retry').addEventListener('click', () => load());
      }
    }

    function clearFilters() {
      Object.assign(state, { keyword: '', categoryId: '', minPrice: '', maxPrice: '', inStockOnly: false, sort: DEFAULT_SORT, page: 0 });
      applyStateToInputs();
      load();
    }

    // Events: any filter change resets to the first page
    const refilter = (patch) => { Object.assign(state, patch, { page: 0 }); load(); };
    const refilterDebounced = debounce(refilter, 350);

    el.keyword.addEventListener('input', e => refilterDebounced({ keyword: e.target.value }));
    el.min.addEventListener('input', e => refilterDebounced({ minPrice: e.target.value }));
    el.max.addEventListener('input', e => refilterDebounced({ maxPrice: e.target.value }));
    el.category.addEventListener('change', e => refilter({ categoryId: e.target.value }));
    el.sort.addEventListener('change', e => refilter({ sort: e.target.value }));
    el.stock.addEventListener('change', e => refilter({ inStockOnly: e.target.checked }));
    el.clear.addEventListener('click', clearFilters);
    el.pager.addEventListener('click', e => {
      const btn = e.target.closest('[data-page]');
      if (!btn || btn.disabled) return;
      state.page = Number(btn.dataset.page);
      load({ scroll: true });
    });

    // Init: fill the category list, then load (so the select shows the URL's category)
    (async () => {
      try {
        const cats = await catalogApi.categories();
        el.category.insertAdjacentHTML('beforeend',
          cats.map(c => `<option value="${Number(c.id)}">${String(c.name).replace(/[<>&"]/g, '')}</option>`).join(''));
      } catch { /* filter still works without the list */ }
      applyStateToInputs();
      load();
    })();
  </script>
</body>
</html>
