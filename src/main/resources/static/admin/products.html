<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Products | MilkCheck Admin</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body class="admin">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main">
      <header class="admin-top" id="adminTop"></header>
      <main class="admin-content" id="main">
        <div class="admin-toolbar">
          <input class="input grow" id="fKeyword" type="search" placeholder="Search products…" aria-label="Search products">
          <select class="input" id="fCategory" aria-label="Filter by category"><option value="">All categories</option></select>
          <button class="btn btn-primary push" id="addBtn">+ Add product</button>
        </div>
        <p class="admin-meta" id="meta" aria-live="polite"></p>
        <section class="panel">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Product</th><th class="num">Price</th><th class="num">Stock</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <nav class="pagination" id="pager" aria-label="Pagination"></nav>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="productModal">
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Add product</h3>
      <form id="productForm" novalidate>
        <div class="form-group">
          <label for="pName">Name</label>
          <input class="input" id="pName" name="name" maxlength="150" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="pCategory">Category</label>
            <select class="input" id="pCategory" name="categoryId" required><option value="">Select…</option></select>
          </div>
          <div class="form-group">
            <label for="pPrice">Price</label>
            <input class="input" id="pPrice" name="price" type="number" min="0" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="pStock">Stock</label>
            <input class="input" id="pStock" name="stock" type="number" min="0" step="1" required>
          </div>
        </div>

        <div class="form-group image-upload">
          <span class="form-label">Product image</span>
          <label class="dropzone" for="productImage">
            <img id="imagePreview" class="image-preview" alt="Product image preview">
            <span id="dropHint" class="dropzone-hint">Click to choose a JPG, PNG or WEBP image (max 5 MB)</span>
          </label>
          <input id="productImage" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
          <input type="hidden" id="productImageUrl" name="imageUrl">
          <div class="upload-row">
            <span id="uploadStatus" class="upload-status" aria-live="polite"></span>
            <button type="button" id="removeImage" class="btn btn-ghost btn-sm" hidden>Remove</button>
          </div>
        </div>

        <div class="form-group">
          <label for="pDesc">Description</label>
          <textarea class="input" id="pDesc" name="description" maxlength="1000"></textarea>
        </div>

        <div class="checks">
          <label class="check"><input type="checkbox" name="featured"> Featured on home page</label>
          <label class="check"><input type="checkbox" name="active" checked> Active (visible in store)</label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save product</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { $, escapeHtml, formatPrice, debounce, setLoading, showError, toast, clearFieldErrors, applyFieldErrors, getParam } from '/js/ui.js';
    import { adminApi, catalogApi, ApiError } from '/js/api.js';
    import { CONFIG } from '/js/config.js';
    import { initAdmin, confirmDialog, showModal, hideModal, renderPager, bindPager } from '/js/admin-kit.js';
    import { initImageUpload } from '/js/image-upload.js';

    const SIZE = 10;
    const state = { keyword: '', categoryId: '', page: 0 };
    let items = [], reqId = 0, editing = null;

    const rowsEl = $('#rows'), metaEl = $('#meta'), pagerEl = $('#pager');
    const modal = $('#productModal'), form = $('#productForm'), f = form.elements;
    const fileInput = $('#productImage');

    const stockOf = (p) => Number(p.stock ?? p.stockQuantity ?? 0);
    const catIdOf = (p) => p.categoryId ?? p.category?.id ?? '';
    const catNameOf = (p) => p.categoryName ?? p.category?.name ?? '';

    function stockCell(n) {
      if (n <= 0) return `<span class="out">0</span>`;
      if (n <= 5) return `<span class="low">${n}</span>`;
      return String(n);
    }

    function rowHtml(p) {
      const active = p.active !== false;
      return `
      <tr data-id="${Number(p.id)}" class="${active ? '' : 'is-inactive'}">
        <td><div class="cell-product">
          <img class="row-thumb" src="${escapeHtml(p.imageUrl || CONFIG.PLACEHOLDER_IMG)}" alt="" loading="lazy">
          <div><b>${escapeHtml(p.name)}</b>
            <small>${escapeHtml(catNameOf(p))}${p.featured ? ' · ★ Featured' : ''}</small></div>
        </div></td>
        <td class="num">${formatPrice(p.price)}</td>
        <td class="num">${stockCell(stockOf(p))}</td>
        <td><span class="status ${active ? 'status-active' : 'status-inactive'}">${active ? 'Active' : 'Inactive'}</span></td>
        <td class="row-actions">
          <button class="btn btn-outline btn-sm" data-act="edit">Edit</button>
          ${active ? '<button class="btn btn-danger btn-sm" data-act="delete">Delete</button>' : ''}
        </td>
      </tr>`;
    }

    async function load() {
      const my = ++reqId;
      rowsEl.innerHTML = `<tr><td colspan="5"><div class="skeleton" style="height:22px;margin:8px 0"></div><div class="skeleton" style="height:22px;margin:8px 0"></div><div class="skeleton" style="height:22px;margin:8px 0"></div></td></tr>`;
      pagerEl.innerHTML = '';
      try {
        const q = { page: state.page, size: SIZE };
        if (state.keyword.trim()) q.keyword = state.keyword.trim();
        if (state.categoryId) q.categoryId = state.categoryId;
        const res = await adminApi.products(q);
        if (my !== reqId) return;

        items = res.content ?? [];
        if (!items.length && state.page > 0) { state.page -= 1; return load(); }

        const total = res.totalElements ?? items.length;
        metaEl.textContent = total === 1 ? '1 product' : `${total} products`;
        if (!items.length) {
          rowsEl.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="margin:20px"><h3>No products found</h3><p>Try a different search, or add a new product.</p></div></td></tr>`;
          return;
        }
        rowsEl.innerHTML = items.map(rowHtml).join('');
        renderPager(pagerEl, res.page ?? state.page, res.totalPages);
      } catch (err) {
        if (my !== reqId) return;
        metaEl.textContent = '';
        rowsEl.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="margin:20px"><h3>Couldn't load products</h3>
          <p>${escapeHtml(err?.message || 'Please try again.')}</p>
          <button class="btn btn-outline btn-sm" id="retry">Try again</button></div></td></tr>`;
        $('#retry').addEventListener('click', load);
      }
    }

    /* ---------- Image upload ---------- */
    const imageUp = initImageUpload({
      input: fileInput,
      preview: $('#imagePreview'),
      hiddenUrl: $('#productImageUrl'),
      status: $('#uploadStatus'),
      removeBtn: $('#removeImage'),
      hint: $('#dropHint'),
    });

    /* ---------- Form ---------- */
    function openForm(p = null) {
      editing = p;
      form.reset();
      clearFieldErrors(form);
      $('#modalTitle').textContent = p ? 'Edit product' : 'Add product';
      f.name.value = p?.name ?? '';
      f.categoryId.value = p ? String(catIdOf(p)) : '';
      f.price.value = p?.price ?? '';
      f.stock.value = p ? stockOf(p) : '';
      f.description.value = p?.description ?? '';
      f.featured.checked = p ? !!p.featured : false;
      f.active.checked = p ? p.active !== false : true;

      if (p?.imageUrl) imageUp.setExisting(p.imageUrl);
      else imageUp.reset();

      showModal(modal);
      f.name.focus();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldErrors(form);
      if (!form.reportValidity()) return;

      const uploadStatus = $('#uploadStatus');
      if (uploadStatus.dataset.kind === 'pending') {
        toast('Please wait for the image to finish uploading', 'error');
        return;
      }
      if (fileInput.files.length && !f.imageUrl.value) {
        toast('Image upload failed. Please choose the image again.', 'error');
        return;
      }

      const stock = parseInt(f.stock.value, 10);
      const payload = {
        name: f.name.value.trim(),
        description: f.description.value.trim(),
        price: Number(f.price.value),
        stockQuantity: stock,
        imageUrl: f.imageUrl.value || null,
        categoryId: Number(f.categoryId.value),
        featured: f.featured.checked,
        active: f.active.checked,
      };

      const btn = $('#saveBtn');
      setLoading(btn, true);
      try {
        if (editing) await adminApi.updateProduct(editing.id, payload);
        else await adminApi.createProduct(payload);
        hideModal(modal);
        toast(editing ? 'Product updated' : 'Product created', 'success');
        load();
      } catch (err) {
        if (err instanceof ApiError && err.fieldErrors && Object.keys(err.fieldErrors).length) {
          applyFieldErrors(form, err.fieldErrors);
        } else {
          showError(err);
        }
      } finally {
        setLoading(btn, false);
      }
    });

    modal.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => hideModal(modal)));
    $('#addBtn').addEventListener('click', () => openForm());

    /* ---------- Table actions ---------- */
    rowsEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = Number(btn.closest('tr').dataset.id);
      const p = items.find(x => Number(x.id) === id);
      if (!p) return;

      if (btn.dataset.act === 'edit') return openForm(p);

      if (btn.dataset.act === 'delete') {
        const ok = await confirmDialog({
          title: `Delete "${p.name}"?`,
          message: 'It will be hidden from the store. Existing orders keep their history, and you can restore it later by editing it.',
          confirmText: 'Delete', danger: true,
        });
        if (!ok) return;
        setLoading(btn, true);
        try {
          await adminApi.deleteProduct(id);
          toast('Product deleted', 'success');
          load();
        } catch (err) {
          setLoading(btn, false);
          showError(err);
        }
      }
    });

    /* ---------- Filters ---------- */
    const refilter = (patch) => { Object.assign(state, patch, { page: 0 }); load(); };
    $('#fKeyword').addEventListener('input', debounce((e) => refilter({ keyword: e.target.value }), 350));
    $('#fCategory').addEventListener('change', (e) => refilter({ categoryId: e.target.value }));
    bindPager(pagerEl, (n) => { state.page = n; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

    /* ---------- Init ---------- */
    (async () => {
      if (!initAdmin('products', 'Products')) return;
      try {
        const cats = await catalogApi.categories();
        const opts = cats.map(c => `<option value="${Number(c.id)}">${escapeHtml(c.name)}</option>`).join('');
        $('#fCategory').insertAdjacentHTML('beforeend', opts);
        $('#pCategory').insertAdjacentHTML('beforeend', opts);
      } catch { /* the form will show a validation error if no category can be chosen */ }
      await load();
      if (getParam('new') === '1') openForm();
    })();
  </script>
</body>
</html>
