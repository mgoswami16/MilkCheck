spring.application.name=milkcheck
server.port=8083

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/milkcheck_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@1234}

# ---------- JPA / Hibernate ----------
# 'update' is convenient for development. Use 'validate' in production
# together with db/schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------- Seed data (data.sql runs after Hibernate creates tables) ----------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- JWT ----------
# Base64-encoded secret, at least 256 bits. Override via environment variable in production.
app.jwt.secret=${JWT_SECRET:bWlsa2NoZWNrLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjQhIQ==}
app.jwt.expiration-ms=86400000

# ---------- Default admin (created on first startup, see Phase 3) ----------
app.admin.email=${ADMIN_EMAIL:admin@milkcheck.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=MilkCheck Admin

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.milkcheck=DEBUG
logging.level.org.springframework.security=INFO

# ---------- Misc ----------
spring.jackson.default-property-inclusion=non_null
spring.web.resources.cache.cachecontrol.max-age=7d
server.compression.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads
app.upload.max-bytes=5242880